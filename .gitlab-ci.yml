stages:
  - build
  - deploy

build_tauri:
  stage: build
  tags:
    - windows-local
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - cd apps/desktop
    - npm install
  script:
    - if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Error "🚨 A variável da chave ta vazia no Runner!"; exit 1 }
    - Write-Host "✅ A chave chegou no Windows e tem $($env:TAURI_SIGNING_PRIVATE_KEY.Length) caracteres."
    - $env:NEXT_PUBLIC_API_URL = "https://api.seneb.com.br/api/v1"
    - npx tauri build
    
    # 🔍 BUSCA UNIVERSAL: Vasculha qualquer subpasta dentro de bundle atrás da assinatura
    - $sigFile = Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -Filter "*.sig" | Select-Object -First 1
    - if (-not $sigFile) { Write-Error "🚨 O Tauri buildou, mas não gerou o .sig! A chave foi rejeitada."; exit 1 }
    
    - $version = (Get-Content package.json | ConvertFrom-Json).version
    - $pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
    - $signature = Get-Content $sigFile.FullName -Raw
    
    # 🧠 INTELIGÊNCIA: Descobre se o instalador é .msi ou .exe baseado na assinatura gerada
    - $ext = if ($sigFile.Name -match "\.msi\.sig$") { ".msi" } else { ".exe" }
    
    # 📝 GERAÇÃO DO JSON DINÂMICO
    - |
      $UpdateData = @{
        version = "v$version"
        notes = "Nova versão disponível"
        pub_date = $pub_date
        platforms = @{
          "windows-x86_64" = @{
            signature = $signature.Trim()
            url = "https://seneb.com.br/Seneb-Setup$ext"
          }
        }
      }
      $UpdateData | ConvertTo-Json -Depth 10 | Out-File -FilePath "update.json" -Encoding utf8
      
  artifacts:
    paths:
      - apps/desktop/update.json
      - apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - apps/desktop/src-tauri/target/release/bundle/msi/*.sig
      - apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
    expire_in: 1 week

deploy_vps_hostinger:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"' 
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "🚀 Iniciando deploy na VPS..."
    
    # 1. PRIMEIRO: Limpamos a casa e baixamos o código novo da VPS.
    # Fazemos isso antes do rsync para o git clean não apagar nossos artefatos!
    - ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
        cd /var/www/seneb/finance_control_saas &&
        git fetch origin main &&
        git reset --hard origin/main &&
        git clean -fd
      "
    
    # 2. AGORA SIM: Enviamos os arquivos soltos (update.json e MSI) para a pasta já limpa
    - echo "📦 Enviando artefatos para a VPS..."
    - rsync -avz -e "ssh -p $SERVER_PORT -o StrictHostKeyChecking=no" apps/desktop/update.json $SERVER_USER@$SERVER_IP:/var/www/seneb/finance_control_saas/apps/web/public/update.json
    - rsync -avz -e "ssh -p $SERVER_PORT -o StrictHostKeyChecking=no" apps/desktop/src-tauri/target/release/bundle/msi/*.msi $SERVER_USER@$SERVER_IP:/var/www/seneb/finance_control_saas/apps/web/public/Seneb-Setup.msi
    
    # 3. POR ÚLTIMO: Buildamos o Next.js (que agora vai enxergar o MSI e o JSON lá dentro) e reiniciamos
    - ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
        export NVM_DIR=\"\$HOME/.nvm\" && [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\" &&
        cd /var/www/seneb/finance_control_saas &&
        
        echo '🐳 Atualizando Backend...' &&
        cd backend &&
        docker compose up -d --build &&

        echo '🌐 Atualizando Web...' &&
        cd ../apps/web &&
        rm -rf .next &&
        npm install &&
        npm run build &&
        
        echo '🔄 Reiniciando PM2...' &&
        pm2 reload seneb-web --update-env
      "
    - echo "✅ Deploy concluído!"