stages:
  - build
  - deploy

build_tauri:
  stage: build
  tags:
    - windows-local
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - cd apps/desktop
    - npm install
  script:
    - $env:Path += ";C:\Users\Administrador\.cargo\bin"
    - rustup default stable
    - if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Error "🚨 A variável da chave ta vazia no Runner!"; exit 1 }
    - Write-Host "✅ A chave chegou no Windows e tem $($env:TAURI_SIGNING_PRIVATE_KEY.Length) caracteres."
    - $env:NEXT_PUBLIC_API_URL = "https://api.seneb.com.br/api/v1"
    # 🩹 SOLUÇÃO TEMPORÁRIA: Pular o WiX (.msi) que dá erro de permissão e buildar só NSIS (.exe)
    - npx tauri build -b nsis
    
    # 🔍 BUSCA UNIVERSAL: Vasculha qualquer subpasta dentro de bundle atrás da assinatura
    - $sigFile = Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -Filter "*.sig" | Select-Object -First 1
    - if (-not $sigFile) { Write-Error "🚨 O Tauri buildou, mas não gerou o .sig! A chave foi rejeitada."; exit 1 }
    
    - $version = (Get-Content package.json | ConvertFrom-Json).version
    - $pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
    - $signature = Get-Content $sigFile.FullName -Raw
    
    # 🧠 INTELIGÊNCIA: Descobre se o instalador é .msi ou .exe baseado na assinatura gerada
    - $ext = if ($sigFile.Name -match "\.msi\.sig$") { ".msi" } else { ".exe" }
    
    # 📝 GERAÇÃO DO JSON DINÂMICO
    - |
      $UpdateData = @{
        version = "v$version"
        notes = "Nova versão disponível"
        pub_date = $pub_date
        platforms = @{
          "windows-x86_64" = @{
            signature = $signature.Trim()
            url = "https://seneb.com.br/Seneb-Setup$ext"
          }
        }
      }
      $jsonContent = $UpdateData | ConvertTo-Json -Depth 10
      $utf8NoBom = New-Object System.Text.UTF8Encoding $false
      $outPath = Join-Path (Get-Location) "update-windows.json"
      [System.IO.File]::WriteAllText($outPath, $jsonContent, $utf8NoBom)
      
  artifacts:
    paths:
      - apps/desktop/update-windows.json
      - apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - apps/desktop/src-tauri/target/release/bundle/msi/*.sig
      - apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
    expire_in: 1 week

build_tauri_linux:
  stage: build
  tags:
    - linux-vps
  image: ubuntu:22.04
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apt-get update
    - apt-get install -y curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - cd apps/desktop
    - npm install
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "🚨 Chave vazia!"; exit 1; fi
    - export NEXT_PUBLIC_API_URL="https://api.seneb.com.br/api/v1"
    
    # Gera .AppImage e .deb para Linux
    - npx tauri build -b appimage,deb
    
    # 🔍 Busca pela assinatura (.AppImage.sig)
    - SIG_FILE=$(find src-tauri/target/release/bundle/ -name "*.AppImage.sig" | head -n 1)
    - if [ -z "$SIG_FILE" ]; then echo "🚨 O Tauri buildou, mas não gerou o .sig!"; exit 1; fi
    
    - SIGNATURE=$(cat "$SIG_FILE")
    # Para garantir a extração do JSON com node ao invés de ferramentas não seguras:
    - VERSION=$(node -p "require('./package.json').version")
    - PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
    
    - |
      cat <<EOF > update-linux.json
      {
        "version": "v$VERSION",
        "notes": "Nova versão disponível",
        "pub_date": "$PUB_DATE",
        "platforms": {
          "linux-x86_64": {
            "signature": "$SIGNATURE",
            "url": "https://seneb.com.br/Seneb-Setup.AppImage"
          }
        }
      }
      EOF
      
  artifacts:
    paths:
      - apps/desktop/update-linux.json
      - apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
      - apps/desktop/src-tauri/target/release/bundle/deb/*.deb
      - apps/desktop/src-tauri/target/release/bundle/appimage/*.sig
      - apps/desktop/src-tauri/target/release/bundle/deb/*.sig
    expire_in: 1 week

deploy_vps_hostinger:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"' 
  before_script:
    - apk add --no-cache openssh-client rsync jq
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "🚀 Iniciando deploy na VPS..."
    
    # 1. PRIMEIRO: Limpamos a casa e baixamos o código novo da VPS.
    # Fazemos isso antes do rsync para o git clean não apagar nossos artefatos!
    - ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
        cd /var/www/seneb/finance_control_saas &&
        git fetch origin main &&
        git reset --hard origin/main &&
        git clean -fd
      "
    
    # 2. COMBINAÇÃO DOS ARQUIVOS DE ATUALIZAÇÃO
    - echo "🧬 Mesclando os arquivos de atualização (Windows + Linux)..."
    - >
      if [ -f apps/desktop/update-windows.json ] && [ -f apps/desktop/update-linux.json ]; then
        jq -s '.[0] * {platforms: (.[0].platforms + .[1].platforms)}' apps/desktop/update-windows.json apps/desktop/update-linux.json > apps/desktop/update.json
      elif [ -f apps/desktop/update-windows.json ]; then
        cp apps/desktop/update-windows.json apps/desktop/update.json
      elif [ -f apps/desktop/update-linux.json ]; then
        cp apps/desktop/update-linux.json apps/desktop/update.json
      else
        echo "{}" > apps/desktop/update.json
      fi
    
    # 3. AGORA SIM: Enviamos os arquivos soltos para a pasta já limpa
    - echo "📦 Enviando artefatos para a VPS..."
    - rsync -avz -e "ssh -p $SERVER_PORT -o StrictHostKeyChecking=no" apps/desktop/update.json $SERVER_USER@$SERVER_IP:/var/www/seneb/finance_control_saas/apps/web/public/update.json
    - rsync -avz -e "ssh -p $SERVER_PORT -o StrictHostKeyChecking=no" apps/desktop/src-tauri/target/release/bundle/nsis/*.exe $SERVER_USER@$SERVER_IP:/var/www/seneb/finance_control_saas/apps/web/public/Seneb-Setup.exe || true
    - rsync -avz -e "ssh -p $SERVER_PORT -o StrictHostKeyChecking=no" apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage $SERVER_USER@$SERVER_IP:/var/www/seneb/finance_control_saas/apps/web/public/Seneb-Setup.AppImage || true
    - rsync -avz -e "ssh -p $SERVER_PORT -o StrictHostKeyChecking=no" apps/desktop/src-tauri/target/release/bundle/deb/*.deb $SERVER_USER@$SERVER_IP:/var/www/seneb/finance_control_saas/apps/web/public/Seneb-Setup.deb || true
    
    # 4. POR ÚLTIMO: Buildamos o Next.js (que agora vai enxergar os instaladores e o JSON lá dentro) e reiniciamos
    - ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
        export NVM_DIR=\"\$HOME/.nvm\" && [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\" &&
        cd /var/www/seneb/finance_control_saas &&
        
        echo '🐳 Atualizando Backend...' &&
        cd backend &&
        docker compose up -d --build &&

        echo '🌐 Atualizando Web...' &&
        cd ../apps/web &&
        rm -rf .next &&
        npm install &&
        npm run build &&
        
        echo '🔄 Reiniciando PM2...' &&
        pm2 reload seneb-web --update-env
      "
    - echo "✅ Deploy concluído!"