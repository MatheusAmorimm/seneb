stages:
  - deploy

deploy_vps_hostinger:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"' 
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "🚀 Iniciando deploy na VPS Hostinger via GitLab Ultimate..."
    
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
        cd /var/www/seneb &&
        echo '⬇️ Baixando código mais recente...' &&
        git pull origin main &&
        
        echo '🐳 Atualizando Backend (Docker)...' &&
        cd backend &&
        docker compose up -d --build &&
        
        echo '🌐 Atualizando Landing Page (PM2)...' &&
        cd ../apps/web &&
        npm install &&
        npm run build &&
        
        echo '🔄 Reiniciando Web...' &&
        cd ../.. &&
        pm2 reload seneb-web --update-env
      "
    - echo "✅ Deploy concluído com sucesso!"