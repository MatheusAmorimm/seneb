stages:
  - build
  - deploy

build_tauri:
  stage: build
  image: rust:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apt-get update
    - apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
    # Install MinGW-w64 and NSIS for Windows cross-compilation
    - apt-get install -y mingw-w64 nsis
    # Install Node
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - npm install -g pnpm
    # Add Rust target
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cd apps/desktop
    - pnpm install
    # Cross compile Tauri app for Windows
    - pnpm run tauri build --target x86_64-pc-windows-gnu
    - version=$(node -p "require('./package.json').version")
    - pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
    - signature=$(cat src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.sig | head -n 1 || cat src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.sig | head -n 1)
    - |
      cat <<EOF > update.json
      {
        "version": "v$version",
        "notes": "Nova versão disponível",
        "pub_date": "$pub_date",
        "platforms": {
          "windows-x86_64": {
            "signature": "$signature",
            "url": "https://seneb.com.br/downloads/Seneb-Setup.exe"
          }
        }
      }
      EOF
  artifacts:
    paths:
      - apps/desktop/update.json
      - apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
      - apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
      - apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.sig
      - apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.sig
    expire_in: 1 week

deploy_vps_hostinger:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"' 
  before_script:
    - apk add --no-cache openssh-client rsync # Added rsync to easily upload update.json
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "🚀 Iniciando deploy na VPS..."
    
    # Upload update.json to VPS
    - rsync -avz -e "ssh -p $SERVER_PORT -o StrictHostKeyChecking=no" apps/desktop/update.json $SERVER_USER@$SERVER_IP:/var/www/seneb/finance_control_saas/apps/web/public/update.json
    # Assuming seneb.com.br serves the apps/web/public directory as its root or similar.
    
    # 🚀 A MÁGICA: A primeira linha do SSH agora carrega o NVM à força!
    - ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
        export NVM_DIR=\"\$HOME/.nvm\" && [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\" &&
        
        cd /var/www/seneb/finance_control_saas &&
        echo '⬇️ Baixando código...' &&
        git pull origin main &&
        
        echo '🐳 Atualizando Backend...' &&
        cd backend &&
        docker compose up -d --build &&
        
        echo '🌐 Atualizando Web...' &&
        cd ../apps/web &&
        npm install &&
        npm run build &&
        
        echo '🔄 Reiniciando PM2...' &&
        cd ../.. &&
        pm2 reload seneb-web --update-env
      "
    - echo "✅ Deploy concluído!"