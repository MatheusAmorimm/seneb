name: Backend Image

# Publica a imagem do backend no GitHub Container Registry a cada push na main
# que toque o backend. O Render faz o próprio build a partir do repositório;
# esta imagem serve para a alternativa em VM (deploy/docker-compose.prod.yml).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build e push (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/matheusamorimm/seneb-backend:latest
            ghcr.io/matheusamorimm/seneb-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
